<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalhes do Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container pt-3">
    <a th:href="@{'/users/index'}" class="btn btn-primary float-end">Voltar</a>
    <h1>Detalhes do Usuário</h1>
    <hr>

    <div class="card p-4">
        <p><strong>ID:</strong> <span th:text="${user.id}"></span></p>
        <p><strong>Nome:</strong> <span th:text="${user.name}"></span></p>
        <p><strong>Arroba:</strong> <span th:text="${user.arroba}"></span></p>
        <p><strong>CPF:</strong> <span th:text="${user.cpf}"></span></p>
        <p><strong>E-mail:</strong> <span th:text="${user.email}"></span></p>
        <p><strong>Idade:</strong> <span th:text="${user.idade}"></span></p>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
