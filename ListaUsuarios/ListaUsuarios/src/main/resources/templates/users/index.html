<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Usuários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

<div class="container pt-3">
    <a th:href="@{'/users/new'}" class="btn btn-primary float-end">Novo Usuário</a>
    <h1>Lista Usuários (<span th:text="${size}">0</span>)</h1>
    <hr>
    <table class="table">
        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Nome</th>
            <th scope="col">Arroba</th>
            <th scope="col">CPF</th>
            <th scope="col">E-mail</th>
            <th scope="col">Idade</th>
            <th scope="col">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <th scope="row" th:text="${user.id}">1</th>
            <td th:text="${user.name}">Mark</td>
            <td th:text="${user.arroba}">Otto</td>
            <td th:text="${user.cpf}">@mdo</td>
            <td th:text="${user.email}">email@exemplo.com</td>
            <td th:text="${user.idade}">0</td>
            <td>
                <a th:href="@{|/users/show/${user.id}|}" class="btn btn-secondary btn-sm">Detalhes</a>
                <a th:href="@{|/users/edit/${user.id}|}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{|/users/delete/${user.id}|}" class="btn btn-danger btn-sm">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
