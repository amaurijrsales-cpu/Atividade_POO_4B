<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes da Categoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2>Detalhes da Categoria</h2>
<div class="card p-4 mt-3">
    <p><strong>ID:</strong> <span th:text="${category.id}"></span></p>
    <p><strong>Descrição:</strong> <span th:text="${category.descricao}"></span></p>

    <a th:href="@{/categories/index}" class="btn btn-secondary mt-3">Voltar</a>
</div>
</body>
</html>
