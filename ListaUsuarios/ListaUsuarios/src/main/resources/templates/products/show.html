<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Detalhes do Produto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2>Detalhes do Produto</h2>
<div class="card p-4 mt-3">
  <p><strong>ID:</strong> <span th:text="${product.id}"></span></p>
  <p><strong>Nome:</strong> <span th:text="${product.nome}"></span></p>
  <p><strong>Preço:</strong> R$ <span th:text="${product.preco}"></span></p>

  <a th:href="@{/products/index}" class="btn btn-secondary mt-3">Voltar</a>
</div>
</body>
</html>
