<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2>Editar Produto</h2>
<form action="#" th:action="@{/products/update}" th:object="${product}" method="post">
    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label class="form-label">Nome:</label>
        <input type="text" th:field="*{nome}" class="form-control" required />
    </div>

    <div class="mb-3">
        <label class="form-label">Preço:</label>
        <input type="number" step="0.01" th:field="*{preco}" class="form-control" required />
    </div>

    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
    <a th:href="@{/products/index}" class="btn btn-secondary">Cancelar</a>
</form>
</body>
</html>
